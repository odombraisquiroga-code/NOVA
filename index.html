<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA - Tu asistente personal</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>✨ NOVA</h1>
    <p>Tu asistente personal</p>
  </header>

  <main>
    <section id="chat" aria-live="polite">
      <div class="message bot">¡Hola! Soy NOVA. ¿En qué puedo ayudarte?</div>
    </section>

    <form id="chatForm">
      <input id="userInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
      <button type="submit">Enviar</button>
    </form>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
