
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA - Tu asistente personal</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>✨ NOVA</h1>
    <p>Tu asistente personal</p>
  </header>

  <main>
    <section id="authPanel">
      <h2>Bienvenido a NOVA</h2>
      <p>Elige cómo quieres entrar.</p>

      <div class="auth-options">
        <h3>Modo personal</h3>
        <form id="authForm">
          <input id="email" type="email" placeholder="Correo electrónico" required>
          <input id="password" type="password" placeholder="Contraseña" required>
          <button id="signInButton" type="button">Iniciar sesión</button>
          <button id="signUpButton" type="button">Crear cuenta</button>
        </form>
      </div>

      <div class="auth-options">
        <h3>Modo invitado</h3>
        <p>Usa NOVA sin registrarte. No se guardarán tus conversaciones ni recuerdos.</p>
        <button id="guestButton" type="button">Entrar como invitado</button>
      </div>

      <p id="authMessage" aria-live="polite"></p>
    </section>

    <section id="appPanel" hidden>
      <p id="userLabel"></p>
      <button id="logoutButton" type="button">Salir de NOVA</button>

      <section id="chat" aria-live="polite">
        <div class="message bot">¡Hola! Soy NOVA. 💙 ¿En qué puedo ayudarte?</div>
      </section>

      <form id="chatForm">
        <input id="userInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
        <button type="submit">Enviar</button>
      </form>

      <section id="memorySection">
        <h2>Mi memoria privada</h2>
        <p>Guarda aquí cosas que quieras que NOVA recuerde.</p>
        <form id="memoryForm">
          <input id="memoryInput" maxlength="1000" placeholder="Quiero recordar..." required>
          <button type="submit">Guardar recuerdo</button>
        </form>
        <p id="memoryMessage" aria-live="polite"></p>
        <ul id="memoryList"></ul>
      </section>
    </section>
  </main>
</body>
</html>
